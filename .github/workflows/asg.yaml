name: ASG Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - secondfactor
      - linux

    steps:

      - name: Configure AWS
        run: |
          aws sts get-caller-identity
          aws configure set region ap-south-1

      - name: Start ASG Instance Refresh
        id: refresh
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name asdasd \
            --preferences MinHealthyPercentage=100,MaxHealthyPercentage=200,InstanceWarmup=300 \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=$REFRESH_ID" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "ASG Instance Refresh Started"
          echo "Refresh ID: $REFRESH_ID"
          echo "=========================================="

      - name: Wait for Instance Refresh
        run: |
          while true; do

            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name asdasd \
              --query "InstanceRefreshes[?InstanceRefreshId=='${{ steps.refresh.outputs.refresh_id }}'].Status" \
              --output text)

            echo "Instance Refresh Status: $STATUS"

            case "$STATUS" in

              Successful)
                echo "=========================================="
                echo "Instance refresh completed successfully."
                echo "=========================================="
                break
                ;;

              Failed)
                echo "=========================================="
                echo "Instance refresh FAILED."
                echo "=========================================="
                exit 1
                ;;

              Cancelled)
                echo "=========================================="
                echo "Instance refresh was CANCELLED."
                echo "=========================================="
                exit 1
                ;;

              RollbackFailed)
                echo "=========================================="
                echo "Instance refresh ROLLBACK FAILED."
                echo "=========================================="
                exit 1
                ;;

              Pending|InProgress|Baking)
                echo "Instance refresh still running..."
                sleep 30
                ;;

              *)
                echo "Unknown status: $STATUS"
                sleep 30
                ;;

            esac

          done

      - name: Verify ASG Instances
        run: |
          echo "=========================================="
          echo "Current ASG Instances"
          echo "=========================================="

          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names asdasd \
            --query 'AutoScalingGroups[0].Instances[*].[InstanceId,HealthStatus,LifecycleState,ProtectedFromScaleIn]' \
            --output table
