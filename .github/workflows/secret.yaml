name: Deploy Secret to ASG and MGR Node

on:
  workflow_dispatch:

jobs:
  deploy-secret:
    runs-on:
      - self-hosted
      - secondfactor
      - linux

    env:
      AWS_REGION: ap-south-1
      SECRET_NAME: secondfactor/prod/env
      SECRET_PATH: /home/secondfactor/secondfactor.ai/backend/.env

      APP_ASG: asdasd
      WORKER_ASG: celery-worker-asg

      # Static / Elastic IP of standalone EC2
      STANDALONE_IP: "172.31.5.228"

    steps:

      # ============================================================
      # 1. Verify AWS access
      # ============================================================

      - name: Verify AWS Identity
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      # ============================================================
      # 2. Get APP ASG instances
      # ============================================================

      - name: Get APP ASG Instances
        id: app_instances
        run: |

          echo "Getting APP ASG instances..."

          APP_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$APP_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          echo "APP instances:"
          echo "$APP_INSTANCES"

          if [ -z "$APP_INSTANCES" ]; then
            echo "ERROR: No APP instances found."
            exit 1
          fi

          echo "instances=$APP_INSTANCES" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Get WORKER ASG instances
      # ============================================================

      - name: Get WORKER ASG Instances
        id: worker_instances
        run: |

          echo "Getting WORKER ASG instances..."

          WORKER_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$WORKER_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          echo "WORKER instances:"
          echo "$WORKER_INSTANCES"

          if [ -z "$WORKER_INSTANCES" ]; then
            echo "ERROR: No WORKER instances found."
            exit 1
          fi

          echo "instances=$WORKER_INSTANCES" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. Get standalone EC2 using static / Elastic IP
      # ============================================================

      - name: Get Standalone EC2 Instance
        id: standalone_instance
        run: |

          echo "=========================================="
          echo "Finding standalone EC2"
          echo "Static IP: $STANDALONE_IP"
          echo "=========================================="

          STANDALONE_INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=ip-address,Values=$STANDALONE_IP" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$STANDALONE_INSTANCE_ID" ] || [ "$STANDALONE_INSTANCE_ID" = "None" ]; then
            echo "ERROR: No running EC2 instance found with IP:"
            echo "$STANDALONE_IP"
            exit 1
          fi

          echo "Standalone EC2 found."
          echo "Static IP: $STANDALONE_IP"
          echo "Instance ID: $STANDALONE_INSTANCE_ID"

          echo "instance_id=$STANDALONE_INSTANCE_ID" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. Deploy secret to APP instances
      # ============================================================

      - name: Deploy Secret to APP Instances
        run: |

          APP_INSTANCES="${{ steps.app_instances.outputs.instances }}"

          for INSTANCE_ID in $APP_INSTANCES; do

            echo "=========================================="
            echo "Deploying secret to APP instance"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy latest SecondFactor secret" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "SECRET_NAME=\"secondfactor/prod/env\"",
                "SECRET_PATH=\"/home/secondfactor/secondfactor.ai/backend/.env\"",
                "TMP_FILE=\"${SECRET_PATH}.tmp\"",
                "aws secretsmanager get-secret-value --secret-id \"$SECRET_NAME\" --region ap-south-1 --query SecretString --output text > \"$TMP_FILE\"",
                "test -s \"$TMP_FILE\"",
                "chown secondfactor:secondfactor \"$TMP_FILE\"",
                "chmod 600 \"$TMP_FILE\"",
                "mv \"$TMP_FILE\" \"$SECRET_PATH\"",
                "echo SECRET_DEPLOYED_SUCCESSFULLY"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Instance $INSTANCE_ID status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Secret deployed successfully."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "SECRET DEPLOYMENT FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            echo "=========================================="
            echo "Reloading application"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            RESTART_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Reload SecondFactor application" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "supervisorctl signal hup all",
                "sleep 5",
                "supervisorctl status"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "Reload Command ID: $RESTART_COMMAND_ID"

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$RESTART_COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Reload status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Application reload completed."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "APPLICATION RELOAD FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$RESTART_COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            echo "=========================================="
            echo "APP instance completed"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

          done

      # ============================================================
      # 6. Deploy secret to WORKER instances
      # ============================================================

      - name: Deploy Secret to WORKER Instances
        run: |

          WORKER_INSTANCES="${{ steps.worker_instances.outputs.instances }}"

          for INSTANCE_ID in $WORKER_INSTANCES; do

            echo "=========================================="
            echo "Deploying secret to WORKER instance"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy latest SecondFactor secret" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "SECRET_NAME=\"secondfactor/prod/env\"",
                "SECRET_PATH=\"/home/secondfactor/secondfactor.ai/backend/.env\"",
                "TMP_FILE=\"${SECRET_PATH}.tmp\"",
                "aws secretsmanager get-secret-value --secret-id \"$SECRET_NAME\" --region ap-south-1 --query SecretString --output text > \"$TMP_FILE\"",
                "test -s \"$TMP_FILE\"",
                "chown secondfactor:secondfactor \"$TMP_FILE\"",
                "chmod 600 \"$TMP_FILE\"",
                "mv \"$TMP_FILE\" \"$SECRET_PATH\"",
                "echo SECRET_DEPLOYED_SUCCESSFULLY"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Instance $INSTANCE_ID status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Secret deployed successfully."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "SECRET DEPLOYMENT FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            echo "=========================================="
            echo "Reloading worker"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            RESTART_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Reload SecondFactor worker" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "supervisorctl signal hup all",
                "sleep 5",
                "supervisorctl status"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "Reload Command ID: $RESTART_COMMAND_ID"

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$RESTART_COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Reload status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Worker reload completed."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "WORKER RELOAD FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$RESTART_COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            echo "=========================================="
            echo "WORKER instance completed"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

          done

      # ============================================================
      # 7. Deploy secret to STANDALONE EC2
      # ============================================================

      - name: Deploy Secret to Standalone EC2
        run: |

          INSTANCE_ID="${{ steps.standalone_instance.outputs.instance_id }}"

          echo "=========================================="
          echo "Deploying secret to STANDALONE EC2"
          echo "Static IP: $STANDALONE_IP"
          echo "Instance: $INSTANCE_ID"
          echo "=========================================="

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy latest SecondFactor secret to standalone EC2" \
            --region "$AWS_REGION" \
            --parameters 'commands=[
              "set -e",
              "SECRET_NAME=\"secondfactor/prod/env\"",
              "SECRET_PATH=\"/home/secondfactor/secondfactor.ai/backend/.env\"",
              "TMP_FILE=\"${SECRET_PATH}.tmp\"",
              "aws secretsmanager get-secret-value --secret-id \"$SECRET_NAME\" --region ap-south-1 --query SecretString --output text > \"$TMP_FILE\"",
              "test -s \"$TMP_FILE\"",
              "chown secondfactor:secondfactor \"$TMP_FILE\"",
              "chmod 600 \"$TMP_FILE\"",
              "mv \"$TMP_FILE\" \"$SECRET_PATH\"",
              "echo SECRET_DEPLOYED_SUCCESSFULLY"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          while true; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Standalone EC2 status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Secret deployed successfully."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo "=========================================="
                echo "STANDALONE SECRET DEPLOYMENT FAILED"
                echo "Instance: $INSTANCE_ID"
                echo "Static IP: $STANDALONE_IP"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                  --output text || true

                exit 1
                ;;

              Pending|InProgress|Delayed)
                sleep 5
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo "=========================================="
          echo "Reloading standalone application"
          echo "Instance: $INSTANCE_ID"
          echo "Static IP: $STANDALONE_IP"
          echo "=========================================="

          RESTART_COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Reload SecondFactor standalone application" \
            --region "$AWS_REGION" \
            --parameters 'commands=[
              "set -e",
              "supervisorctl signal hup all",
              "sleep 5",
              "supervisorctl status"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "Reload Command ID: $RESTART_COMMAND_ID"

          while true; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$RESTART_COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            echo "Standalone reload status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Standalone application reload completed."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo "=========================================="
                echo "STANDALONE APPLICATION RELOAD FAILED"
                echo "Instance: $INSTANCE_ID"
                echo "Static IP: $STANDALONE_IP"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --command-id "$RESTART_COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "$AWS_REGION" \
                  --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                  --output text || true

                exit 1
                ;;

              Pending|InProgress|Delayed)
                sleep 5
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo "=========================================="
          echo "STANDALONE EC2 COMPLETED"
          echo "Static IP: $STANDALONE_IP"
          echo "Instance: $INSTANCE_ID"
          echo "=========================================="

      # ============================================================
      # 8. Final verification
      # ============================================================

      - name: Verify All Instances
        run: |

          echo "=========================================="
          echo "APP ASG"
          echo "=========================================="

          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$APP_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[*].[InstanceId,HealthStatus,LifecycleState]' \
            --output table

          echo "=========================================="
          echo "WORKER ASG"
          echo "=========================================="

          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$WORKER_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[*].[InstanceId,HealthStatus,LifecycleState]' \
            --output table

          echo "=========================================="
          echo "STANDALONE EC2"
          echo "=========================================="

          INSTANCE_ID="${{ steps.standalone_instance.outputs.instance_id }}"

          aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --region "$AWS_REGION" \
            --query 'Reservations[].Instances[].[
              InstanceId,
              State.Name,
              PublicIpAddress,
              PrivateIpAddress
            ]' \
            --output table

          echo "=========================================="
          echo "SECRET DEPLOYMENT COMPLETED"
          echo "=========================================="
