name: Deploy Secret to ASG Instances

on:
  workflow_dispatch:

jobs:
  deploy-secret:
    runs-on:
      - self-hosted
      - secondfactor
      - linux

    env:
      AWS_REGION: ap-south-1
      SECRET_NAME: secondfactor/prod/env
      SECRET_PATH: /home/secondfactor/secondfactor.ai/backend/.env
      APP_ASG: asdasd
      WORKER_ASG: celery-worker-asg

    steps:

      # ============================================================
      # 1. Verify AWS access
      # ============================================================

      - name: Verify AWS Identity
        run: |
          echo "AWS Region: $AWS_REGION"
          aws sts get-caller-identity

      # ============================================================
      # 2. Get APP ASG instances
      # ============================================================

      - name: Get APP ASG Instances
        id: app_instances
        run: |

          echo "Getting APP ASG instances..."

          APP_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$APP_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          echo "APP instances:"
          echo "$APP_INSTANCES"

          if [ -z "$APP_INSTANCES" ]; then
            echo "ERROR: No APP instances found."
            exit 1
          fi

          echo "instances=$APP_INSTANCES" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 3. Get WORKER ASG instances
      # ============================================================

      - name: Get WORKER ASG Instances
        id: worker_instances
        run: |

          echo "Getting WORKER ASG instances..."

          WORKER_INSTANCES=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$WORKER_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          echo "WORKER instances:"
          echo "$WORKER_INSTANCES"

          if [ -z "$WORKER_INSTANCES" ]; then
            echo "ERROR: No WORKER instances found."
            exit 1
          fi

          echo "instances=$WORKER_INSTANCES" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. Deploy secret to APP instances one at a time
      # ============================================================

      - name: Deploy Secret to APP Instances
        run: |

          APP_INSTANCES="${{ steps.app_instances.outputs.instances }}"

          for INSTANCE_ID in $APP_INSTANCES; do

            echo "=========================================="
            echo "Deploying secret to APP instance"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            # ------------------------------------------------------
            # Deploy secret
            # ------------------------------------------------------

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy latest SecondFactor secret" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "SECRET_NAME=\"secondfactor/prod/env\"",
                "SECRET_PATH=\"/home/secondfactor/secondfactor.ai/backend/.env\"",
                "TMP_FILE=\"${SECRET_PATH}.tmp\"",
                "aws secretsmanager get-secret-value --secret-id \"$SECRET_NAME\" --region ap-south-1 --query SecretString --output text > \"$TMP_FILE\"",
                "test -s \"$TMP_FILE\"",
                "chown secondfactor:secondfactor \"$TMP_FILE\"",
                "chmod 600 \"$TMP_FILE\"",
                "mv \"$TMP_FILE\" \"$SECRET_PATH\"",
                "echo SECRET_DEPLOYED_SUCCESSFULLY"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            # ------------------------------------------------------
            # Wait for secret deployment
            # ------------------------------------------------------

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Instance $INSTANCE_ID status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Secret deployed successfully."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "SECRET DEPLOYMENT FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            # ------------------------------------------------------
            # Reload APP
            # ------------------------------------------------------

            echo "=========================================="
            echo "Reloading application"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            RESTART_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Reload SecondFactor application" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "sudo supervisorctl signal hup secondfactor",
                "sleep 5",
                "sudo supervisorctl status secondfactor"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "Reload Command ID: $RESTART_COMMAND_ID"

            # ------------------------------------------------------
            # Wait for APP reload
            # ------------------------------------------------------

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$RESTART_COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Reload status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Application reload completed."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "APPLICATION RELOAD FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$RESTART_COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            echo "=========================================="
            echo "APP instance completed"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

          done

      # ============================================================
      # 5. Deploy secret to WORKER instances
      # ============================================================

      - name: Deploy Secret to WORKER Instances
        run: |

          WORKER_INSTANCES="${{ steps.worker_instances.outputs.instances }}"

          for INSTANCE_ID in $WORKER_INSTANCES; do

            echo "=========================================="
            echo "Deploying secret to WORKER instance"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            # ------------------------------------------------------
            # Deploy secret
            # ------------------------------------------------------

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy latest SecondFactor secret" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "SECRET_NAME=\"secondfactor/prod/env\"",
                "SECRET_PATH=\"/home/secondfactor/secondfactor.ai/backend/.env\"",
                "TMP_FILE=\"${SECRET_PATH}.tmp\"",
                "aws secretsmanager get-secret-value --secret-id \"$SECRET_NAME\" --region ap-south-1 --query SecretString --output text > \"$TMP_FILE\"",
                "test -s \"$TMP_FILE\"",
                "chown secondfactor:secondfactor \"$TMP_FILE\"",
                "chmod 600 \"$TMP_FILE\"",
                "mv \"$TMP_FILE\" \"$SECRET_PATH\"",
                "echo SECRET_DEPLOYED_SUCCESSFULLY"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "SSM Command ID: $COMMAND_ID"

            # ------------------------------------------------------
            # Wait for secret deployment
            # ------------------------------------------------------

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Instance $INSTANCE_ID status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Secret deployed successfully."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "SECRET DEPLOYMENT FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            # ------------------------------------------------------
            # Reload WORKER
            # ------------------------------------------------------

            echo "=========================================="
            echo "Reloading worker"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

            RESTART_COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Reload SecondFactor worker" \
              --region "$AWS_REGION" \
              --parameters 'commands=[
                "set -e",
                "sudo supervisorctl signal hup all",
                "sleep 5",
                "sudo supervisorctl status"
              ]' \
              --query 'Command.CommandId' \
              --output text)

            echo "Reload Command ID: $RESTART_COMMAND_ID"

            # ------------------------------------------------------
            # Wait for WORKER reload
            # ------------------------------------------------------

            while true; do

              STATUS=$(aws ssm get-command-invocation \
                --command-id "$RESTART_COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --region "$AWS_REGION" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              echo "Reload status: $STATUS"

              case "$STATUS" in

                Success)
                  echo "Worker reload completed."
                  break
                  ;;

                Failed|Cancelled|TimedOut|Cancelling)

                  echo "=========================================="
                  echo "WORKER RELOAD FAILED"
                  echo "Instance: $INSTANCE_ID"
                  echo "=========================================="

                  aws ssm get-command-invocation \
                    --command-id "$RESTART_COMMAND_ID" \
                    --instance-id "$INSTANCE_ID" \
                    --region "$AWS_REGION" \
                    --query '[Status,StatusDetails,StandardOutputContent,StandardErrorContent]' \
                    --output text || true

                  exit 1
                  ;;

                Pending|InProgress|Delayed)
                  sleep 5
                  ;;

                *)
                  sleep 5
                  ;;

              esac

            done

            echo "=========================================="
            echo "WORKER instance completed"
            echo "Instance: $INSTANCE_ID"
            echo "=========================================="

          done

      # ============================================================
      # 6. Final verification
      # ============================================================

      - name: Verify ASG Instances
        run: |

          echo "=========================================="
          echo "APP ASG"
          echo "=========================================="

          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$APP_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[*].[InstanceId,HealthStatus,LifecycleState]' \
            --output table

          echo "=========================================="
          echo "WORKER ASG"
          echo "=========================================="

          aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$WORKER_ASG" \
            --region "$AWS_REGION" \
            --query 'AutoScalingGroups[0].Instances[*].[InstanceId,HealthStatus,LifecycleState]' \
            --output table

          echo "=========================================="
          echo "SECRET DEPLOYMENT COMPLETED"
          echo "=========================================="
